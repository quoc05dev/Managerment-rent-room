# Cấu hình thực nghiệm PSO — nguồn sự thật duy nhất cho mọi run.
# Chương 2 (lý thuyết): F = α·L_norm + β·R_norm + γ·P_SLA.
# Chương 3 (thực nghiệm): 4 chiều (backend + mysql), w_oom = 100.
# Mọi thay đổi phải commit kèm lý do; harness đọc file này, không hard-code.

research:
  name: "PSO tối ưu tài nguyên Docker cho hệ thống quản lý thuê nhà"
  version: 3

slo:
  p95_ms: 500            # L_SLA trong công thức
  max_error_rate: 0.01
  max_oom: 0

resources:
  # Ngân sách chung của ứng dụng; cũng là mẫu số của R_norm.
  cpu_avail: 4.0
  ram_avail_mb: 4096
  # Mỗi container đóng góp 2 chiều [CPU, RAM] → 4 chiều.
  containers: [backend, mysql]

load:
  # Gọi trực tiếp backend để loại nhiễu Cloudflare/nginx; stack clone dùng port riêng.
  base_url: "http://127.0.0.1:18085"
  # TODO(P2): đặt bằng 70% RPS bền vững đo được từ capacity test.
  target_rps: 20
  warmup_seconds: 60
  ramp_seconds: 20
  steady_seconds: 120
  rampdown_seconds: 20
  endpoints:
    - "/health"
    - "/room/rent-home"
    - "/room/1000001/rentaler?pageNo=0&pageSize=10"

jvm:
  # heap_pct không phải biến PSO; cố định cho mọi candidate, kiểm tra độ nhạy riêng.
  max_ram_percentage: 70

search_space:
  # Áp dụng cho từng container trong resources.containers.
  cpus: { min: 0.5, max: 4.0, step: 0.25 }
  mem_mb: { min: 768, max: 4096, step: 128 }

methods:
  fixed:
    backend: { cpus: 2.0, mem_mb: 2048 }
    mysql: { cpus: 1.0, mem_mb: 1024 }
    runs: 10
  rule:
    cpu_headroom: 1.5    # CPU = ceil(peak_cpu * 1.5 / 0.25) * 0.25
    ram_headroom: 1.3    # RAM = ceil(peak_ws * 1.3 / 128) * 128
    runs: 10

pso:
  swarm: 10
  iterations: 8
  w: 0.72
  c1: 1.49
  c2: 1.49
  vmax_ratio: 0.2
  seed: 42
  repetitions: 1          # 1 lần/candidate trong vòng lặp
  validation_runs: 10     # chạy lại GBest cuối để kiểm chứng
  stall_iterations: 3     # dừng nếu gBest không cải thiện K vòng

fitness:
  alpha: 0.5
  beta: 0.5
  gamma: 1.0
  w_oom: 100              # Chương 3: OOM phải chi phối phần vượt ngưỡng khác
  sensitivity:
    gamma: [0.5, 1.0, 2.0]

budget:
  max_evaluations: 80     # swarm × iterations × repetitions
  max_hours: 10
  per_eval_minutes: 4.5

baselines:
  grid_points: 12
  random_points: 12

# Cấu hình thực nghiệm PSO — nguồn sự thật duy nhất cho mọi run.
# Hàm mục tiêu theo Chương 2: F = α·L_norm + β·R_norm + γ·P_SLA.
# Mọi thay đổi phải commit kèm lý do; harness đọc file này, không hard-code.

research:
  name: "PSO tối ưu tài nguyên Docker cho hệ thống quản lý thuê nhà"
  version: 2

slo:
  p95_ms: 500            # L_SLA trong công thức
  max_error_rate: 0.01
  max_oom: 0

resources:
  # Mẫu số của R_norm: ΣCPU/CPU_avail + ΣRAM/RAM_avail (bằng biên trên search space).
  cpu_avail: 4.0
  ram_avail_mb: 4096
  # Mỗi container đóng góp 2 chiều [CPU, RAM]. Thêm "mysql" để thành 4 chiều.
  containers: [backend]

load:
  # Gọi trực tiếp backend để loại nhiễu Cloudflare/nginx; stack clone dùng port riêng.
  base_url: "http://127.0.0.1:8083"
  # TODO(P2): đặt bằng 70% RPS bền vững đo được từ capacity test.
  target_rps: 20
  warmup_seconds: 60
  ramp_seconds: 20
  steady_seconds: 120
  rampdown_seconds: 20
  endpoints:
    - "/health"
    - "/room/rent-home"
    - "/room/1000001/rentaler?pageNo=0&pageSize=10"

jvm:
  # heap_pct không phải biến PSO; cố định cho mọi candidate, kiểm tra độ nhạy riêng.
  max_ram_percentage: 70

search_space:
  cpus: { min: 0.5, max: 4.0, step: 0.25 }
  mem_mb: { min: 768, max: 4096, step: 128 }

pso:
  swarm: 12
  iterations: 10
  w: 0.72
  c1: 1.49
  c2: 1.49
  vmax_ratio: 0.2
  seed: 42
  repetitions: 1          # 1 lần/candidate trong vòng lặp
  validation_runs: 10     # chạy lại GBest cuối để kiểm chứng

fitness:
  alpha: 0.5
  beta: 0.5
  gamma: 1.0
  sensitivity:
    gamma: [0.5, 1.0, 2.0]

budget:
  max_evaluations: 120    # swarm × iterations × repetitions (chưa tính baseline/validation)
  max_hours: 10

baselines:
  grid_points: 27
  random_points: 27

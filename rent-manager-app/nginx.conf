gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;
gzip_vary on;

# Tầng này là container nginx, luôn nằm SAU edge nginx của host.
# Giữ X-Forwarded-Proto do host nginx gửi xuống ($scheme = https ở host).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # Static assets cache (hashed filenames từ React build)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media/file endpoints của backend (ưu tiên ^~ trước regex đuổi file .jpg/.png)
    location ^~ /image/ {
        proxy_pass http://backend:8080/image/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /document/ {
        proxy_pass http://backend:8080/document/;
        proxy_set_header Host $host;
    }

    location ^~ /view-file/ {
        proxy_pass http://backend:8080/view-file/;
        proxy_set_header Host $host;
    }

    # Exact API endpoints trùng prefix với trang React Router (/admin/*, /rentaler/*)
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }

    location = /rentaler/me {
        proxy_pass http://backend:8080/rentaler/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location = /admin/me {
        proxy_pass http://backend:8080/admin/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    # Toàn bộ API backend (cả root "/room" lẫn "/room/...", không nuốt "/room-hired"
    # hay "/oauth2/redirect" của React Router, và không dính nginx auto_redirect 301).
    location ~ ^/(auth|api|room|user|account|contract|maintenance|request|follow|blog-store|statistical|customer|export-bill|oauth2/authorize|oauth2/callback)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    # WebSocket (SockJS / STOMP)
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400;
    }

    # Static images & fonts của frontend
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (bao gồm /oauth2/redirect, /room-hired, /admin/*, /rentaler/*)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

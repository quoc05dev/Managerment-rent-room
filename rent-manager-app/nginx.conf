gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;
gzip_vary on;

# Tầng này là container nginx, luôn nằm SAU edge nginx của host.
# Edge đã quyết định scheme thật ($scheme ở host) rồi gửi xuống bằng header
# X-Forwarded-Proto. Nếu ở đây ghi đè bằng $scheme (luôn là "http" vì container
# chỉ listen 80) thì backend sẽ tưởng request đến qua http dù thật ra là https.
# Hậu quả: OAuth2 redirect sai về http://, cookie `Secure` không được set,
# WebSocket handshake sai scheme.
# => Giữ giá trị edge gửi xuống; chỉ tự suy ra khi không có edge (chạy dev).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Khớp spring.servlet.multipart.max-file-size: 100MB.
    # Mặc định nginx là 1MB => 413 khi upload ảnh/hợp đồng lớn.
    client_max_body_size 100m;

    # Static assets cache (hashed filenames từ React build)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /auth/ {
        proxy_pass http://backend:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
    }

    location /room/ {
        proxy_pass http://backend:8080/room/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /user/ {
        proxy_pass http://backend:8080/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /account/ {
        proxy_pass http://backend:8080/account/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /contract/ {
        proxy_pass http://backend:8080/contract/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /maintenance/ {
        proxy_pass http://backend:8080/maintenance/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /request/ {
        proxy_pass http://backend:8080/request/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /follow/ {
        proxy_pass http://backend:8080/follow/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /blog-store/ {
        proxy_pass http://backend:8080/blog-store/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /statistical/ {
        proxy_pass http://backend:8080/statistical/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    # API root paths without trailing slash (/account, /room, /contract, ...)
    # location /account/ does NOT match "/account", so these would fall through
    # to the SPA fallback and return index.html instead of JSON.
    location ~ ^/(account|room|contract|maintenance|request|follow|statistical)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location = /rentaler/me {
        proxy_pass http://backend:8080/rentaler/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location = /admin/me {
        proxy_pass http://backend:8080/admin/me;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /customer/ {
        proxy_pass http://backend:8080/customer/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /export-bill {
        proxy_pass http://backend:8080/export-bill;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /image/ {
        proxy_pass http://backend:8080/image/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /document/ {
        proxy_pass http://backend:8080/document/;
        proxy_set_header Host $host;
    }

    location ^~ /view-file/ {
        proxy_pass http://backend:8080/view-file/;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400;
    }
}

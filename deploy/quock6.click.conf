# =============================================================================
# EDGE REVERSE PROXY — quock6.click  (Cloudflare Flexible, temporary)
# =============================================================================
# Chạy TRỰC TIẾP trên host (systemd), giữ port 80/443.
# Cloudflare terminate TLS ở edge, sau đó nối HTTP vào origin qua port 80.
# Flexible tạm bỏ TLS giữa Cloudflare và origin; port 443 bên dưới được giữ
# để truy cập trực tiếp/rollback về Full (Strict).
#
# Cần đặt trước khi deploy:
#   /etc/nginx/ssl/quock6.click.pem  = Origin Certificate (Cloudflare dashboard)
#   /etc/nginx/ssl/quock6.click.key  = Private Key tương ứng
# (Cloudflare > SSL/TLS > Origin Server > Create Certificate)
#
# Trách nhiệm của file này:
#   1. Nhận kết nối từ Cloudflare
#   2. Khôi phục IP thật của client (CF-Connecting-IP)
#   3. Chuyển tiếp TẤT CẢ vào container nginx của frontend: 127.0.0.1:3100
#      (container tự phân tuyến /api/ /room/ /ws/... sang backend).
# =============================================================================

# WebSocket: giữ header Upgrade khi proxy xuống container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $quock6_forwarded_port {
    https   443;
    default $server_port;
}

# --- Cloudflare real IP ---------------------------------------------------
# Chỉ tin CF-Connecting-IP khi request đến từ dải IP của Cloudflare, nếu không
# kẻ tấn công gọi thẳng IP origin có thể giả mạo IP client (log/rate-limit sai).
# Dải IP lấy từ https://www.cloudflare.com/ips-v4 và /ips-v6 — cập nhật khi CF đổi.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Cloudflare Flexible kết nối origin qua HTTP:80; không redirect ở origin vì
# sẽ tạo vòng lặp HTTPS. Flexible có nghĩa traffic Cloudflare -> VPS không mã hóa.
server {
    listen 80;
    server_name quock6.click www.quock6.click;

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3004;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $quock6_forwarded_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        client_max_body_size 100m;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    3600s;
    }
}

# Origin HTTPS cho Cloudflare.
server {
    listen 443 ssl http2;
    server_name quock6.click www.quock6.click;

    ssl_certificate     /etc/nginx/ssl/quock6.click.pem;
    ssl_certificate_key /etc/nginx/ssl/quock6.click.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Khớp spring.servlet.multipart.max-file-size: 100MB (application.yml).
    client_max_body_size 100m;

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3004;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;

        # --- Header chuẩn hóa ---
        # $scheme = https ở đây => backend sinh OAuth2 redirect đúng https.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # --- WebSocket (/ws/ của STOMP) ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # --- Timeout ---
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    3600s;
    }
}

name: Diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set +e
            cd ~/Quoc/Managerment-rent-room
            echo "=== metric names present ==="
            curl -sS -G --data-urlencode 'query=node_cpu_seconds_total' http://127.0.0.1:9090/api/v1/query | head -c 300; echo
            echo "=== http metric names ==="
            curl -sS http://127.0.0.1:9090/api/v1/label/__name__/values | tr ',' '\n' | grep -iE 'http_server_requests|jvm_memory_used|node_cpu|node_memory' | head
            echo "=== sample http metric with labels ==="
            curl -sS -G --data-urlencode 'query=http_server_requests_seconds_count' http://127.0.0.1:9090/api/v1/query | head -c 500; echo
            echo "=== sample jvm metric ==="
            curl -sS -G --data-urlencode 'query=jvm_memory_used_bytes{area="heap"}' http://127.0.0.1:9090/api/v1/query | head -c 500; echo
            echo "=== grafana dashboard json panels ==="
            PW=$(grep '^GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2)
            curl -sS -u "admin:$PW" http://127.0.0.1:3004/api/dashboards/uid/rental-overview | head -c 200; echo

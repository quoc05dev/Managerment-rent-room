name: Experiments

# Điều khiển stack clone rental-exp trên VPS (không đụng production).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | up | seed | smoke | status | results | down | dry | run"
        required: true
        default: probe
        type: choice
        options: [probe, up, seed, smoke, status, results, down, dry, run]
      max_evals:
        description: "Số evaluation tối đa cho mode=run (mặc định 4 để smoke)"
        required: false
        default: "4"

jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run experiment stack task
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
          MAX_EVALS: ${{ inputs.max_evals }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 115m
          envs: MODE,MAX_EVALS
          script: |
            set -uo pipefail
            cd ~/Quoc/Managerment-rent-room
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            if [ "$MODE" = "dry" ]; then
              python3 experiments/pso/runner.py --dry-run
            elif [ "$MODE" = "run" ]; then
              python3 experiments/pso/runner.py --max-evals "$MAX_EVALS"
            else
              bash experiments/stack/stack.sh "$MODE"
            fi

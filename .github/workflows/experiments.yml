name: Experiments

# Điều khiển stack clone rental-exp trên VPS (không đụng production).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | up | seed | smoke | status | down"
        required: true
        default: probe
        type: choice
        options: [probe, up, seed, smoke, status, down]

jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run experiment stack task
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 115m
          envs: MODE
          script: |
            set -uo pipefail
            cd ~/Quoc/Managerment-rent-room
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            bash experiments/stack/stack.sh "$MODE"

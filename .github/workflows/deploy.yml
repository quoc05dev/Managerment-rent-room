name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend (verify Dockerfile)
        run: |
          cd rental-management
          docker build -t rental-backend:test .

      - name: Build frontend (verify Dockerfile)
        run: |
          cd rent-manager-app
          docker build -t rental-frontend:test .

      - name: Save images
        run: |
          docker save rental-backend:test | gzip > /tmp/backend.tar.gz
          docker save rental-frontend:test | gzip > /tmp/frontend.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/*.tar.gz
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: rent-manager-app/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd rent-manager-app
          npm ci

      - name: Run frontend lint
        run: |
          cd rent-manager-app
          npx eslint src/ --max-warnings=999 || true
          echo "Lint completed"

      - name: Run frontend build test
        env:
          CI: false
        run: |
          cd rent-manager-app
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: maven

      - name: Run backend compile
        continue-on-error: true
        run: |
          cd rental-management
          ./mvnw compile -B

  deploy:
    name: Deploy
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp

      - name: Upload images to server and deploy
        uses: appleboy/ssh-action@v1
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Quoc/Managerment-rent-room

            echo "=== [1/4] Pulling latest code ==="
            git pull origin main

            echo "=== [2/4] Stopping old containers ==="
            docker compose down --remove-orphans

            echo "=== [3/4] Pruning old images and build cache ==="
            docker image prune -af
            docker builder prune -af --filter "until=24h"

            echo "=== [4/4] Building and starting containers ==="
            docker compose up -d --build

            echo "=== [5/5] Configuring and starting host nginx ==="
            sudo apt-get install -y nginx 2>/dev/null || true
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo cp ~/Quoc/Managerment-rent-room/deploy/quock6.click.conf /etc/nginx/sites-available/quock6.click.conf
            sudo ln -sf /etc/nginx/sites-available/quock6.click.conf /etc/nginx/sites-enabled/quock6.click.conf
            if ! grep -q "sites-enabled" /etc/nginx/nginx.conf; then
              echo 'include /etc/nginx/sites-enabled/*;' | sudo tee -a /etc/nginx/nginx.conf > /dev/null
            fi
            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx
            echo "=== Deploy completed at $(date) ==="

name: CI/CD Pipeline

on:
  push:
    branches: [main]
    # Tài liệu/thực nghiệm không ảnh hưởng image: tránh redeploy production.
    paths-ignore:
      - 'docs/**'
      - 'experiments/**'
      - '*.md'
      - '.github/workflows/db-seed.yml'
      - '.github/workflows/p0-baseline.yml'
      - '.github/workflows/experiments.yml'

permissions:
  contents: read

# Không cho 2 lần deploy chạy chồng lên nhau trên cùng VPS.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # docker build vừa là "compile gate" (Maven/npm build bên trong Dockerfile).
      # Không upload artifact: VPS tự build lại từ source khi deploy.
      - name: Build backend image
        run: docker build -t rental-backend:ci ./rental-management

      - name: Build frontend image
        run: docker build -t rental-frontend:ci ./rent-manager-app

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOMAIN: quock6.click
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DOMAIN: ${{ env.DOMAIN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DOMAIN
          script_stop: true
          command_timeout: 40m
          script: |
            set -e
            cd ~/Quoc/Managerment-rent-room

            echo "=== [1/5] Sync code to origin/main ==="
            git fetch origin
            git checkout -f main
            git reset --hard origin/main

            echo "=== [2/5] Build & start containers (no downtime wipe) ==="
            # Không 'down' + không 'prune -af' trước build: giữ image cũ để rollback,
            # compose tự recreate service khi config đổi.
            docker compose up -d --build --remove-orphans
            # Host nginx container resolves backend's Docker IP at startup; refresh it
            # whenever a backend rebuild/recreate may change that IP.
            docker compose up -d --force-recreate frontend
            docker image prune -f

            echo "=== [3/5] Configure host nginx (Cloudflare Flexible temporary mode) ==="
            if [ ! -f /etc/nginx/ssl/${DOMAIN}.pem ] || [ ! -f /etc/nginx/ssl/${DOMAIN}.key ]; then
              echo "ERROR: thiếu Cloudflare Origin Certificate:"
              echo "  /etc/nginx/ssl/${DOMAIN}.pem"
              echo "  /etc/nginx/ssl/${DOMAIN}.key"
              exit 1
            fi
            command -v nginx >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y nginx; }
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo cp deploy/${DOMAIN}.conf /etc/nginx/sites-available/${DOMAIN}.conf
            sudo ln -sf /etc/nginx/sites-available/${DOMAIN}.conf /etc/nginx/sites-enabled/${DOMAIN}.conf
            if ! grep -q "sites-enabled" /etc/nginx/nginx.conf; then
              echo 'include /etc/nginx/sites-enabled/*;' | sudo tee -a /etc/nginx/nginx.conf > /dev/null
            fi
            sudo nginx -t
            sudo systemctl enable nginx
            # reload: áp dụng config mới không kill worker -> site khác trên
            # cùng nginx host không bị gián đoạn. reload fail khi chưa từng chạy.
            sudo systemctl reload nginx || sudo systemctl restart nginx

            echo "=== [4/5] Smoke test through host HTTP nginx (Flexible origin) ==="
            ok=0
            for i in $(seq 1 36); do
              if curl -fsS --resolve ${DOMAIN}:80:127.0.0.1 http://${DOMAIN}/health >/dev/null; then
                ok=1; break
              fi
              sleep 5
            done

            echo "=== [5/5] Status ==="
            docker compose ps
            if [ "$ok" != "1" ]; then
              echo "Smoke test FAILED — backend/db chưa sẵn sàng. Log backend:"
              docker compose logs --tail=80 backend
              exit 1
            fi
            echo "=== Deploy OK at $(date) ==="

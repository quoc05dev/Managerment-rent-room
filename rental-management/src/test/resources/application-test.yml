spring:
  datasource:
    url: jdbc:h2:mem:rental_home;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;INIT=CREATE SCHEMA IF NOT EXISTS RENTAL_HOME\;SET SCHEMA RENTAL_HOME
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
      platform: h2
  mail:
    host: localhost
    port: 25
  activemq:
    broker-url: vm://embedded?broker.persistent=false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.activemq.ActiveMQAutoConfiguration

file:
  uploadDir: ${java.io.tmpdir}/test-upload/
  tempExportExcel: ${java.io.tmpdir}/test-export/

app:
  auth:
    tokenSecret: testSecretKeyForUnitTestingPurposesOnly1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
    tokenExpirationMsec: 86400000
  cors:
    allowedOrigins: http://localhost:3000
  oauth2:
    authorizedRedirectUris:
      - http://localhost:3000/oauth2/redirect

logging:
  level:
    com.cntt.rentalmanagement: DEBUG

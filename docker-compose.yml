version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: rental_home
    ports:
      - "3316:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  activemq:
    image: rmohr/activemq:5.15.9
    container_name: rental-activemq
    restart: unless-stopped
    ports:
      - "61617:61616"
      - "8162:8161"
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    volumes:
      - activemq-data:/data/activemq
      - activemq-log:/var/log/activemq

  backend:
    build:
      context: ./rental-management
      dockerfile: Dockerfile
    container_name: rental-backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      activemq:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rental_home?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080,https://quock6.click,http://quock6.click
      APP_OAUTH2_AUTHORIZED_REDIRECT_URIS: http://localhost:3000/oauth2/redirect,https://quock6.click/oauth2/redirect,http://quock6.click/oauth2/redirect
    volumes:
      - upload-data:/hdd/data/photographer

  frontend:
    build:
      context: ./rent-manager-app
      dockerfile: Dockerfile
    container_name: rental-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3100:80"

volumes:
  mysql-data:
  activemq-data:
  activemq-log:
  upload-data:

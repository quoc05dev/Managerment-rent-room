services:
  mysql:
    image: mysql:8.0
    container_name: rental-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: rental_home
    # Chỉ bind localhost: DB không lộ ra Internet. Dùng SSH tunnel nếu cần debug.
    ports:
      - "127.0.0.1:3316:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  activemq:
    image: rmohr/activemq:5.15.9
    container_name: rental-activemq
    restart: unless-stopped
    # Chỉ bind localhost: không publish broker/webconsole ra Internet.
    ports:
      - "127.0.0.1:61617:61616"
      - "127.0.0.1:8162:8161"
    environment:
      ACTIVEMQ_ADMIN_LOGIN: ${ACTIVEMQ_ADMIN_LOGIN:-admin}
      ACTIVEMQ_ADMIN_PASSWORD: ${ACTIVEMQ_ADMIN_PASSWORD:-admin}
    volumes:
      - activemq-data:/data/activemq
      - activemq-log:/var/log/activemq

  backend:
    build:
      context: ./rental-management
      dockerfile: Dockerfile
    container_name: rental-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      activemq:
        condition: service_started
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rental_home?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080,https://quock6.click,https://www.quock6.click
      APP_OAUTH2_AUTHORIZED_REDIRECT_URIS: http://localhost:3000/oauth2/redirect,https://quock6.click/oauth2/redirect,https://www.quock6.click/oauth2/redirect
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - upload-data:/hdd/data/photographer

  frontend:
    build:
      context: ./rent-manager-app
      dockerfile: Dockerfile
    container_name: rental-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:80"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: rental-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: rental-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.1
    container_name: rental-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in server .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Phục vụ qua host nginx tại https://quock6.click/grafana/
      GF_SERVER_ROOT_URL: https://quock6.click/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mysql-data:
  activemq-data:
  activemq-log:
  upload-data:
  prometheus-data:
  grafana-data:
